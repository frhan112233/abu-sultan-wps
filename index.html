<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو سلطان - معالج ملفات حماية الأجور (WPS)</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            background-color: #059669;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #047857;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            background: #f8fafc;
            padding: 10px;
            border-radius: 5px;
            border-right: 4px solid #1e3a8a;
        }
        .whatsapp {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        .whatsapp a {
            color: #25d366;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>أبو سلطان</h2>
        <p>معالج وتسهيل ملفات حماية الأجور (WPS)</p>
    </div>

    <div style="text-align: center; font-weight: bold; margin-bottom: 15px;">
        ⚡ المعالجة السريعة (بضغطة زر واحدة)
    </div>

    <div class="form-group">
        <label>اختيار ملف TXT</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div class="form-group">
        <label>عدد النسخ المطلوبة</label>
        <input type="number" id="repeatCount" value="3" min="1">
    </div>

    <button id="processBtn">🚀 معالجة وتنزيل الملفات فوراً</button>

    <div class="footer-note">
        ✅ <b>بضغطة زر:</b> اختر الملف وعدد النسخ واضغط الزر الأعلى، وسيقوم النظام بتنزيل النسخ دفعة واحدة بكل سلاسة.
    </div>

    <div class="whatsapp">
        💬 للتواصل والدعم الفني:<br>
        <a href="https://wa.me/966581158968" target="_blank">📱 0581158968</a>
    </div>
</div>

<script>
    document.getElementById('processBtn').addEventListener('click', function () {
        const fileInput = document.getElementById('fileInput');
        const repeatCountInput = document.getElementById('repeatCount').value;

        if (fileInput.files.length === 0) {
            alert('الرجاء اختيار ملف TXT أولاً');
            return;
        }

        const file = fileInput.files[0];
        const originalName = file.name.replace(/\.[^/.]+$/, "");
        const totalFiles = parseInt(repeatCountInput) || 1;

        const reader = new FileReader();

        reader.onload = function (e) {
            let decoder = new TextDecoder('utf-8');
            let text = decoder.decode(e.target.result);
            
            // ضبط فواصل الأسطر لمعيار ويندوز CRLF بدقة تامة ومطابقة للأصل
            let normalizedText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            let finalContent = normalizedText.replace(/\n/g, '\r\n');

            // محاكاة التحميل المتتالي السريع بفاصل زمني بسيط لتجاوز حظر المتصفح وتقديمها بضغطة زر
            for (let i = 1; i <= totalFiles; i++) {
                setTimeout(() => {
                    let blob = new Blob([finalContent], { type: "text/plain;charset=utf-8" });
                    let url = URL.createObjectURL(blob);

                    let a = document.createElement("a");
                    a.href = url;
                    a.download = `${originalName}_${i}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, (i - 1) * 400); // تأخير بسيط بين الملف والآخر لضمان قبول الجوال لها
            }

            alert('تم بدء تجهيز وتنزيل الملفات المطلوبة بنجاح!');
        };

        reader.readAsArrayBuffer(file);
    });
</script>

</body>
</html>
