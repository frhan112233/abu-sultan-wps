<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو سلطان - معالج ملفات حماية الأجور (WPS)</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="file"], select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
            background-color: #fff;
            font-size: 15px;
        }
        button {
            width: 100%;
            background-color: #1e3a8a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .download-btn {
            background-color: #059669;
            margin-top: 8px;
        }
        .download-btn:hover {
            background-color: #047857;
        }
        #resultsArea {
            margin-top: 20px;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            background: #f8fafc;
            padding: 10px;
            border-radius: 5px;
            border-right: 4px solid #1e3a8a;
        }
        .whatsapp {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        .whatsapp a {
            color: #25d366;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>أبو سلطان</h2>
        <p>معالج وتسهيل ملفات حماية الأجور (WPS)</p>
    </div>

    <div style="text-align: center; font-weight: bold; margin-bottom: 15px;">
        ⚙️ التسمية الذكية الشاملة للرقم الموحد
    </div>

    <div class="form-group">
        <label>اختيار ملف TXT</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div class="form-group">
        <label>عدد الملفات المطلوبة</label>
        <select id="repeatCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
        </select>
    </div>

    <button id="processBtn">معالجة وتجهيز الملفات (CRLF)</button>

    <!-- منطقة أزرار التنزيل الحقيقية -->
    <div id="resultsArea"></div>

    <div class="footer-note">
        ✅ <b>دعم شامل:</b> استخراج دقيق للرقم الموحد بجميع صيغه (مثل 4-68944 أو 01-4551236) مع إمكانية توليد حتى 30 نسخة.
    </div>

    <div class="whatsapp">
        💬 للتواصل والدعم الفني:<br>
        <a href="https://wa.me/966581158968" target="_blank">📱 0581158968</a>
    </div>
</div>

<script>
    document.getElementById('processBtn').addEventListener('click', function () {
        const fileInput = document.getElementById('fileInput');
        const repeatCountInput = document.getElementById('repeatCount').value;
        const resultsArea = document.getElementById('resultsArea');
        resultsArea.innerHTML = ''; // مسح النتائج السابقة

        if (fileInput.files.length === 0) {
            alert('الرجاء اختيار ملف TXT أولاً');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function (e) {
            let decoder = new TextDecoder('utf-8');
            let text = decoder.decode(e.target.result);
            
            // ضبط فواصل الأسطر لمعيار ويندوز CRLF بدقة تامة ومطابقة الأصل
            let normalizedText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            let finalContent = normalizedText.replace(/\n/g, '\r\n');

            let unifiedNumber = "";
            
            // 1. البحث عن النمط الذي يحتوي على شرطة (رقم أو رقمين - أرقام المنشأة) مثل 4-68944 أو 01-4551236
            let match = text.match(/\b\d{1,2}-\d{4,8}\b/);
            if (match) {
                let rawVal = match[0];
                unifiedNumber = rawVal.includes('-') ? rawVal.split('-')[1] : rawVal;
            } else {
                // 2. البحث عن أي أرقام متصلة من 5 إلى 8 خانات داخل نص الملف
                let generalMatch = text.match(/\b\d{5,8}\b/);
                if (generalMatch) {
                    unifiedNumber = generalMatch[0];
                }
            }

            // 3. إذا لم يوجد في النص، نبحث في اسم الملف الأصلي
            if (!unifiedNumber) {
                let nameMatch = file.name.match(/\d{5,}/);
                if (nameMatch) {
                    unifiedNumber = nameMatch[0];
                } else {
                    unifiedNumber = "WPS_File";
                }
            }

            let totalFiles = parseInt(repeatCountInput) || 1;

            // إنشاء أزرار التحميل بالرقم المستخرج
            for (let i = 1; i <= totalFiles; i++) {
                let blob = new Blob([finalContent], { type: "text/plain;charset=utf-8" });
                let url = URL.createObjectURL(blob);

                let btn = document.createElement("button");
                btn.className = "download-btn";
                btn.innerHTML = `📥 حفظ الملف (${unifiedNumber}) - نسخة (${i})`;
                
                let fileName = `${unifiedNumber}_${i}.txt`;

                btn.onclick = function() {
                    let a = document.createElement("a");
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                resultsArea.appendChild(btn);
            }

            alert('تمت المعالجة وتجهيز الملفات بنجاح!');
        };

        reader.readAsArrayBuffer(file);
    });
</script>

</body>
</html>
