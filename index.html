<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو سلطان - معالج ملفات حماية الأجور (WPS)</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            background-color: #1e3a8a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .download-btn {
            background-color: #059669;
            margin-top: 8px;
        }
        .download-btn:hover {
            background-color: #047857;
        }
        #resultsArea {
            margin-top: 20px;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            background: #f8fafc;
            padding: 10px;
            border-radius: 5px;
            border-right: 4px solid #1e3a8a;
        }
        .whatsapp {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        .whatsapp a {
            color: #25d366;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>أبو سلطان</h2>
        <p>معالج وتسهيل ملفات حماية الأجور (WPS)</p>
    </div>

    <div style="text-align: center; font-weight: bold; margin-bottom: 15px;">
        ⚙️ تحويل فواصل الأسطر وتوليد النسخ (مطابق للأصل تماماً)
    </div>

    <div class="form-group">
        <label>اختيار ملف TXT</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div class="form-group">
        <label>عدد الملفات المطلوبة</label>
        <input type="number" id="repeatCount" value="1" min="1">
    </div>

    <button id="processBtn">معالجة وتجهيز الملفات (CRLF)</button>

    <!-- منطقة أزرار التنزيل المستقلة -->
    <div id="resultsArea"></div>

    <div class="footer-note">
        ✅ <b>نسخ مطابق 100%:</b> يتم أخذ محتوى الملف بالكامل دون أي حذف أو تعديل، وتحويله إلى معيار (CRLF) مع تجهيز الأزرار للتحميل.
    </div>

    <div class="whatsapp">
        💬 للتواصل والدعم الفني:<br>
        <a href="https://wa.me/966581158968" target="_blank">📱 0581158968</a>
    </div>
</div>

<script>
    document.getElementById('processBtn').addEventListener('click', function () {
        const fileInput = document.getElementById('fileInput');
        const repeatCountInput = document.getElementById('repeatCount').value;
        const resultsArea = document.getElementById('resultsArea');
        resultsArea.innerHTML = ''; // مسح النتائج السابقة

        if (fileInput.files.length === 0) {
            alert('الرجاء اختيار ملف TXT أولاً');
            return;
        }

        const file = fileInput.files[0];
        const originalName = file.name.replace(/\.[^/.]+$/, "");

        const reader = new FileReader();

        // قراءة الملف كـ ArrayBuffer لضمان عدم ضياع أي حرف أو بايت أو تشفير خاص
        reader.onload = function (e) {
            let decoder = new TextDecoder('utf-8');
            let text = decoder.decode(e.target.result);
            
            // تحويل فواصل الأسطر إلى معيار ويندوز CRLF بدقة وبدون حذف أي سطر
            let normalizedText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            let finalContent = normalizedText.replace(/\n/g, '\r\n');

            let totalFiles = parseInt(repeatCountInput) || 1;

            // إنشاء أزرار التحميل المستقلة بالعدد المطلوب
            for (let i = 1; i <= totalFiles; i++) {
                let blob = new Blob([finalContent], { type: "text/plain;charset=utf-8" });
                let url = URL.createObjectURL(blob);

                let btn = document.createElement("a");
                btn.href = url;
                btn.download = `${originalName}_${i}.txt`;
                btn.className = "download-btn";
                btn.style.display = "block";
                btn.style.textAlign = "center";
                btn.style.padding = "12px";
                btn.style.color = "white";
                btn.style.backgroundColor = "#059669";
                btn.style.borderRadius = "5px";
                btn.style.textDecoration = "none";
                btn.style.fontWeight = "bold";
                btn.style.marginTop = "8px";
                btn.innerHTML = `📥 تنزيل الملف رقم (${i})`;

                resultsArea.appendChild(btn);
            }

            alert('تم تجهيز الملفات بنجاح مطابقة للأصل تماماً!');
        };

        reader.readAsArrayBuffer(file);
    });
</script>

</body>
</html>
