<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو سلطان - معالج ملفات حماية الأجور</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .header-box {
            background-color: #1d4ed8;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .header-box h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        .header-box p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .section-title {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .label-text {
            text-align: right;
            font-size: 13px;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        .file-input-container {
            display: flex;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background: #f8f9fa;
            overflow: hidden;
            margin-bottom: 15px;
            align-items: center;
        }
        .file-input-container input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            background-color: #e9ecef;
            border-left: 1px solid #ced4da;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            white-space: nowrap;
        }
        .custom-file-upload:hover {
            background-color: #dde2e6;
        }
        .file-name-display {
            padding: 0 10px;
            font-size: 13px;
            color: #555;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
            text-align: right;
        }
        .input-number {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            background-color: #fff;
            text-align: right;
            box-sizing: border-box;
        }
        .btn {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #166534;
        }
        .btn-success {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
            display: none;
        }
        .btn-success:hover {
            background-color: #166534;
        }
        .footer-note {
            font-size: 12px;
            color: #555;
            border-top: 1px dashed #dee2e6;
            padding-top: 12px;
            margin-top: 15px;
            text-align: right;
            line-height: 1.6;
        }
        .support {
            margin-top: 15px;
            font-size: 13px;
            color: #333;
        }
        .support a {
            color: #15803d;
            font-weight: bold;
            direction: ltr;
            display: inline-block;
            text-decoration: none;
        }
        .support a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-box">
        <h2>أبو سلطان</h2>
        <p>معالج وتسهيل ملفات حماية الأجور (WPS)</p>
    </div>

    <div class="section-title">⚙️ التسمية الذكية الشاملة للرقم الموحد</div>

    <div class="label-text">اختيار ملف TXT</div>
    <div class="file-input-container">
        <span class="file-name-display" id="fileName">لم يتم اختيار أي ملف</span>
        <label class="custom-file-upload" for="fileInput">اختيار ملف</
