<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو سلطان - معالج ملفات حماية الأجور</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .abu-sultan-box {
            background-color: #15803d !important;
            color: white !important;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .abu-sultan-box h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        .abu-sultan-box p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .section-title {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .label-text {
            text-align: right;
            font-size: 13px;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        .file-input-container {
            display: flex;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background: #f8f9fa;
            overflow: hidden;
            margin-bottom: 15px;
            align-items: center;
        }
        .file-input-container input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            background-color: #e9ecef;
            border-left: 1px solid #ced4da;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            white-space: nowrap;
        }
        .custom-file-upload:hover {
            background-color: #dde2e6;
        }
        .file-name-display {
            padding: 0 10px;
            font-size: 13px;
            color: #555;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
            text-align: right;
        }
        .input-number {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            background-color: #fff;
            text-align: right;
            box-sizing: border-box;
        }
        .btn-green {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .btn-green:hover {
            background-color: #166534;
        }
        .btn-success {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
            display: none;
        }
        .btn-success:hover {
            background-color: #166534;
        }
        .footer-note {
            font-size: 12px;
            color: #555;
            border-top: 1px dashed #dee2e6;
            padding-top: 12px;
            margin-top: 15px;
            text-align: right;
            line-height: 1.6;
        }
        .support {
            margin-top: 15px;
            font-size: 13px;
            color: #333;
        }
        .support a {
            color: #15803d;
            font-weight: bold;
            direction: ltr;
            display: inline-block;
            text-decoration: none;
        }
        .support a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="abu-sultan-box">
        <h2>أبو سلطان</h2>
        <p>معالج وتسهيل ملفات حماية الأجور (WPS)</p>
    </div>

    <div class="section-title">⚙ التسمية الذكية الشاملة للرقم الموحد</div>

    <div class="label-text">اختيار ملف TXT</div>
    <div class="file-input-container">
        <span class="file-name-display" id="fileName">لم يتم اختيار أي ملف</span>
        <label class="custom-file-upload" for="fileInput">اختيار ملف</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div class="label-text">عدد الملفات المطلوبة</div>
    <input type="number" id="fileCount" class="input-number" value="1" min="1" max="100">

    <button class="btn-green" id="processBtn">معالجة وتجهيز الملفات (CRLF)</button>
    <button class="btn-success" id="saveBtn">حفظ الملف</button>

    <div class="footer-note">
        ✅ مطابقة تامة: استخراج رقم الملف وحفظه بدون أسطر فارغة إضافية مع دعم معيار CRLF.
    </div>

    <div class="support">
        💬 للتواصل والدعم الفني:<br>
        <a href="https://wa.me/966581158968" target="_blank">0581158968</a> 📱
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const processBtn = document.getElementById('processBtn');
    const saveBtn = document.getElementById('saveBtn');
    const fileCountInput = document.getElementById('fileCount');
    
    let processedContent = "";
    let currentFileName = "";

    fileInput.addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {
            fileName.textContent = file.name;

            const reader = new FileReader();
            reader.onload = function (e) {
                let text = e.target.result;
                
                // استخراج رقم الملف الداخلي وتثبيته بالصيغة الإنجليزية الصحيحة
                const internalMatch = text.match(/\b\d{2}-\d{7}\b/) || text.match(/\d{4,}-\d+/) || text.match(/\d{6,}/);
                
                if (internalMatch) {
                    currentFileName = internalMatch[0] + ".txt";
                } else {
                    currentFileName = file.name;
                }

                // تنظيف فواصل الأسطر وإزالة الأسطر الفارغة تماماً للمطابقة الكاملة
                text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                let lines = text.split('\n').filter(line => line.trim() !== '');
                processedContent = lines.join('\r\n');
            };
            reader.readAsText(file, 'UTF-8');
        }
    });

    function updateSaveButtonText() {
        const count = fileCountInput.value || 1;
        saveBtn.innerHTML = `حفظ الملف (<span style="direction: ltr; display: inline-block;">${currentFileName}</span>) - نسخة (${count})`;
    }

    fileCountInput.addEventListener('input', function() {
        if (processedContent) {
            updateSaveButtonText();
        }
    });

    processBtn.addEventListener('click', function () {
        if (!processedContent) {
            alert('الرجاء اختيار ملف نصي أولاً!');
            return;
        }
        updateSaveButtonText();
        saveBtn.style.display = 'block';
        alert('تمت معالجة وتجهيز الملفات بنجاح!');
    });

    saveBtn.addEventListener('click', function () {
        if (!processedContent) return;
        
        const count = parseInt(fileCountInput.value) || 1;
        
        for (let i = 1; i <= count; i++) {
            const blob = new Blob([processedContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            if (count > 1) {
                const dotIndex = currentFileName.lastIndexOf('.');
                if (dotIndex !== -1) {
                    a.download = currentFileName.substring(0, dotIndex) + `_copy${i}` + currentFileName.substring(dotIndex);
                } else {
                    a.download = `${currentFileName}_copy${i}.txt`;
                }
            } else {
                a.download = currentFileName;
            }
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    });
</script>

</body>
</html>
