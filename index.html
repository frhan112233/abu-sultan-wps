<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو سلطان - معالج ملفات حماية الأجور (WPS)</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            background-color: #1e3a8a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            background: #f8fafc;
            padding: 10px;
            border-radius: 5px;
            border-right: 4px solid #1e3a8a;
        }
        .whatsapp {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        .whatsapp a {
            color: #25d366;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>أبو سلطان</h2>
        <p>معالج وتسهيل ملفات حماية الأجور (WPS)</p>
    </div>

    <div style="text-align: center; font-weight: bold; margin-bottom: 15px;">
        ⚙️ تحويل وضبط فواصل الأسطر وتكرار الملفات
    </div>

    <div class="form-group">
        <label>اختيار ملف TXT</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div class="form-group">
        <label>عدد التكرار (لتوليد النسخ وترقيمها)</label>
        <input type="number" id="repeatCount" value="1" min="1">
    </div>

    <button id="processBtn">معالجة وتنزيل الملفات (CRLF)</button>

    <div class="footer-note">
        ✅ <b>حفظ تلقائي:</b> يأخذ اسم الملف الأصلي ويضيف عليه ترقيم النسخ تلقائياً مع معيار ويندوز (CRLF).
    </div>

    <div class="whatsapp">
        💬 للتواصل والدعم الفني:<br>
        <a href="https://wa.me/966581158968" target="_blank">📱 0581158968</a>
    </div>
</div>

<script>
    document.getElementById('processBtn').addEventListener('click', function () {
        const fileInput = document.getElementById('fileInput');
        const repeatCountInput = document.getElementById('repeatCount').value;

        if (fileInput.files.length === 0) {
            alert('الرجاء اختيار ملف TXT أولاً');
            return;
        }

        const file = fileInput.files[0];
        const originalName = file.name.replace(/\.[^/.]+$/, ""); // استخراج اسم الملف بدون امتداد .txt

        const reader = new FileReader();

        reader.onload = function (e) {
            let text = e.target.result;
            
            let cleanText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            let lines = cleanText.split('\n');
            
            let repeatCount = parseInt(repeatCountInput) || 1;
            let employeeLines = [];
            let header = lines[0] || "";

            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() !== "" && !lines[i].startsWith("-")) {
                    employeeLines.push(lines[i]);
                }
            }

            let finalLines = [header];
            for (let c = 0; c < repeatCount; c++) {
                employeeLines.forEach(l => finalLines.push(l));
            }

            let finalContent = finalLines.join("\r\n");

            let blob = new Blob([finalContent], { type: "text/plain;charset=utf-8" });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            
            // تسمية الملف باسم الملف الأصلي مضافاً إليه عدد النسخ كترقيم
            link.download = `${originalName}_نسخة_${repeatCount}.txt`;
            
            link.click();

            alert('تم بنجاح!');
        };

        reader.readAsText(file);
    });
</script>

</body>
</html>
