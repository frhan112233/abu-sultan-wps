<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو سلطان - ناسخ ملفات حماية الأجور (WPS)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; direction: rtl; text-align: center; padding: 20px; }
        .card { background: white; max-width: 500px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a365d; font-size: 24px; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #cbd5e0; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #faf5ff; }
        input[type="file"] { display: none; }
        label { background: #4a5568; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: inline-block; }
        .controls { margin: 20px 0; display: flex; justify-content: center; align-items: center; gap: 10px; }
        input[type="number"] { width: 70px; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; text-align: center; font-size: 16px; }
        button { background: #2b6cb0; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #2c5282; }
        .info-box { background: #ebf8ff; border: 1px solid #bee3f8; padding: 12px; border-radius: 6px; font-size: 14px; margin-top: 15px; text-align: right; }
    </style>
</head>
<body>

<div class="card">
    <h1>📑 ناسخ ملفات حماية الأجور (WPS)</h1>
    
    <div class="upload-area">
        <p id="fileName">اختر ملف WPS بصيغة TXT</p>
        <label for="fileInput">اختيار ملف</label>
        <input type="file" id="fileInput" accept=".txt" onchange="updateFileName()">
    </div>

    <div class="controls">
        <label style="background:none; color:black; padding:0;">عدد النسخ المطلوبة:</label>
        <input type="number" id="copyCount" value="10" min="1" max="50">
    </div>

    <button onclick="duplicateWPS()">تكرار الملفات وتحميلها فوراً</button>

    <div class="info-box">
        <b>✅ المميزات التلقائية:</b>
        <ul>
            <li>تحديث الرقم المرجعي فريد لكل نسخة لضمان القبول في <b>مدد</b>.</li>
            <li>تسمية الملفات تلقائياً (_1, _2, _3...).</li>
            <li>ضبط الترميز المعتمد (UTF-8 with BOM & Windows CRLF).</li>
        </ul>
    </div>
</div>

<script>
function updateFileName() {
    const fileInput = document.getElementById('fileInput');
    if (fileInput.files.length > 0) {
        document.getElementById('fileName').innerText = fileInput.files[0].name;
    }
}

function duplicateWPS() {
    const fileInput = document.getElementById('fileInput');
    const copyCount = parseInt(document.getElementById('copyCount').value);

    if (!fileInput.files.length) {
        alert('الرجاء اختيار ملف WPS أولاً!');
        return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        let originalContent = e.target.result;
        
        // توحيد الأسطر أولاً
        let lines = originalContent.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

        if (lines.length === 0) {
            alert('الملف فارغ!');
            return;
        }

        // إنشاء وتنزيل النسخ المحددة
        for (let i = 1; i <= copyCount; i++) {
            let modifiedLines = [...lines];
            let headerParts = modifiedLines[0].split(',');

            // تعديل الرقم المرجعي في السطر الأول لضمان تجاوز فحص مدد
            if (headerParts.length > 1) {
                let randomID = Math.floor(100000 + Math.random() * 900000);
                headerParts[0] = headerParts[0] + "_" + randomID;
                modifiedLines[0] = headerParts.join(',');
            }

            // إعادة تجميع النص مع صيغة أسطر Windows CRLF
            let newContent = modifiedLines.join('\r\n');

            // إعداد الملف بالترميز الصحيح UTF-8 with BOM
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, newContent], { type: 'text/plain;charset=utf-8' });

            // تنزيل الملف باسم متسلسل
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            
            let baseName = file.name.substring(0, file.name.lastIndexOf('.'));
            link.download = `${baseName}_${i}.txt`;
            
            setTimeout(() => {
                link.click();
            }, i * 200); // فاصل زمني بسيط بين التنزيلات
        }
    };

    reader.readAsText(file);
}
</script>

</body>
</html>
