<script>
    let loadedFileContent = "";
    let originalFileName = "";

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            originalFileName = file.name;
            document.getElementById('fileNameDisplay').textContent = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                loadedFileContent = e.target.result;
            };
            reader.readAsText(file);
        }
    }

    async function processAndDownload() {
        if (!loadedFileContent) {
            alert("يرجى اختيار ملف TXT أولاً!");
            return;
        }

        const count = parseInt(document.getElementById('copyCount').value) || 1;
        let customName = document.getElementById('customFileName').value.trim();

        if (!customName) {
            customName = originalFileName ? originalFileName.replace('.txt', '') : 'WPS_File';
        }

        for (let i = 1; i <= count; i++) {
            let finalFileName = `${customName}_${i}.txt`;
            
            let blob = new Blob([loadedFileContent], { type: 'text/plain;charset=utf-8' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = finalFileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // إضافة تأخير زمني بسيط (0.3 ثانية) بين كل ملف لمنع تداخل التنزيلات في المتصفح
            await new Promise(resolve => setTimeout(resolve, 300));
        }
    }
</script>
