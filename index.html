<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو سلطان - معالج ملفات حماية الأجور (WPS)</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            background-color: #1e3a8a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .download-btn {
            background-color: #059669;
            margin-top: 8px;
        }
        .download-btn:hover {
            background-color: #047857;
        }
        #resultsArea {
            margin-top: 20px;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            background: #f8fafc;
            padding: 10px;
            border-radius: 5px;
            border-right: 4px solid #1e3a8a;
        }
        .whatsapp {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        .whatsapp a {
            color: #25d366;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>أبو سلطان</h2>
        <p>معالج وتسهيل ملفات حماية الأجور (WPS)</p>
    </div>

    <div style="text-align: center; font-weight: bold; margin-bottom: 15px;">
        ⚙️ التسمية الذكية بالرقم الموحد من الملف
    </div>

    <div class="form-group">
        <label>اختيار ملف TXT</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div class="form-group">
        <label>عدد الملفات المطلوبة</label>
        <input type="number" id="repeatCount" value="1" min="1">
    </div>

    <button id="processBtn">معالجة وتجهيز الملفات (CRLF)</button>

    <!-- منطقة أزرار التنزيل الحقيقية -->
    <div id="resultsArea"></div>

    <div class="footer-note">
        ✅ <b>التسمية المباشرة:</b> يستخرج النظام الرقم الموحد (مثل 4551236) من محتوى الملف ويضعها كاسم للملفات المحفوظة.
    </div>

    <div class="whatsapp">
        💬 للتواصل والدعم الفني:<br>
        <a href="https://wa.me/966581158968" target="_blank">📱 0581158968</a>
    </div>
</div>

<script>
    document.getElementById('processBtn').addEventListener('click', function () {
        const fileInput = document.getElementById('fileInput');
        const repeatCountInput = document.getElementById('repeatCount').value;
        const resultsArea = document.getElementById('resultsArea');
        resultsArea.innerHTML = ''; // مسح النتائج السابقة

        if (fileInput.files.length === 0) {
            alert('الرجاء اختيار ملف TXT أولاً');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function (e) {
            let decoder = new TextDecoder('utf-8');
            let text = decoder.decode(e.target.result);
            
            // ضبط فواصل الأسطر لمعيار ويندوز CRLF بدقة تامة ومطابقة الأصل
            let normalizedText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            let finalContent = normalizedText.replace(/\n/g, '\r\n');

            // استخراج الرقم الموحد بدقة (البحث عن الأرقام التي تأتي بعد الشرطة مثل 4551236 أو أرقام المنشأة)
            let unifiedNumber = "WPS_File";
            
            // البحث عن نمط مثل 01-4551236 أو الأرقام المكونة من 7 خانات داخل النص
            let match = text.match(/\d{2}-\d{7}/) || text.match(/\b\d{7}\b/);
            if (match) {
                // إذا وجد صيغة مثل 01-4551236 يأخذ الجزء الأخير أو يزيل الشرطة
                let rawVal = match[0];
                if (rawVal.includes('-')) {
                    unifiedNumber = rawVal.split('-')[1]; // يأخذ الرقم بعد الشرطة مثل 4551236
                } else {
                    unifiedNumber = rawVal;
                }
            }

            let totalFiles = parseInt(repeatCountInput) || 1;

            // إنشاء أزرار التحميل بالرقم الموحد المستخرج
            for (let i = 1; i <= totalFiles; i++) {
                let blob = new Blob([finalContent], { type: "text/plain;charset=utf-8" });
                let url = URL.createObjectURL(blob);

                let btn = document.createElement("button");
                btn.className = "download-btn";
                btn.innerHTML = `📥 حفظ الملف (${unifiedNumber}) - نسخة (${i})`;
                
                let fileName = `${unifiedNumber}_${i}.txt`;

                btn.onclick = function() {
                    let a = document.createElement("a");
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                resultsArea.appendChild(btn);
            }

            alert('تم استخراج الرقم الموحد وتجهيز الملفات بنجاح!');
        };

        reader.readAsArrayBuffer(file);
    });
</script>

</body>
</html>
