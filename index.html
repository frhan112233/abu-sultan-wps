<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو سلطان - ناسخ ملفات حماية الأجور (WPS)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            border: 1px solid #e1e4e8;
        }
        .header {
            background-color: #1a365d;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0 0 8px 0;
            font-size: 22px;
        }
        .header p {
            margin: 0;
            font-size: 13px;
            color: #cbd5e0;
        }
        .content {
            padding: 20px;
        }
        .title-section {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
        }
        .file-upload-box {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background-color: #f8fafc;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .file-upload-box input[type="file"] {
            display: none;
        }
        .btn-select {
            background-color: #4a5568;
            color: white;
            padding: 8px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }
        .file-name-display {
            font-size: 13px;
            color: #718096;
            margin-bottom: 5px;
        }
        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .form-group label {
            font-size: 14px;
            color: #2d3748;
            font-weight: bold;
        }
        .form-group input[type="number"], .form-group input[type="text"] {
            width: 50%;
            padding: 6px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #2b6cb0;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #2c5282;
        }
        .info-box {
            background-color: #ebf8ff;
            border: 1px solid #bee3f8;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            color: #2b6cb0;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            font-size: 13px;
            color: #4a5568;
            padding-top: 10px;
            border-top: 1px solid #edf2f7;
        }
        .footer a {
            color: #2b6cb0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>أبو سلطان</h1>
        <p>خدمات وتسهيل أعمال حماية الأجور (WPS)</p>
    </div>

    <div class="content">
        <div class="title-section">📝 ناسخ ملفات حماية الأجور (WPS)</div>

        <div class="file-upload-box" onclick="document.getElementById('fileInput').click()">
            <div class="file-name-display" id="fileNameDisplay">اختر ملف TXT</div>
            <button type="button" class="btn-select">اختيار ملف</button>
            <input type="file" id="fileInput" accept=".txt" onchange="handleFileSelect(event)">
        </div>

        <div class="form-group">
            <label for="customFileName">اسم الملف الناتج:</label>
            <input type="text" id="customFileName" placeholder="مثال: 1170012">
        </div>

        <div class="form-group">
            <label for="copyCount">عدد النسخ المطلوبة:</label>
            <input type="number" id="copyCount" value="2" min="1" max="100">
        </div>

        <button class="btn-submit" onclick="processAndDownload()">تكرار وتحميل الملفات المباشرة (TXT)</button>

        <div class="info-box">
            🔒 <b>معالجة آمنة:</b> تتم العملية بالكامل داخل جهازك لضمان الخصوصية.<br>
            ✅ <b>الحفاظ على التوقيع:</b> يتم النسخ بنفس التنسيق والدقة لضمان تحفيظها بـ "الأحدث".
        </div>

        <div class="footer">
            💬 للتواصل والدعم الفني عبر واتساب:<br>
            <a href="https://wa.me/966581158968" target="_blank">📱 0581158968</a>
        </div>
    </div>
</div>

<script>
    let loadedFileContent = "";
    let originalFileName = "";

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            originalFileName = file.name;
            document.getElementById('fileNameDisplay').textContent = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                loadedFileContent = e.target.result;
            };
            reader.readAsText(file);
        }
    }

    async function processAndDownload() {
        if (!loadedFileContent) {
            alert("يرجى اختيار ملف TXT أولاً!");
            return;
        }

        const count = parseInt(document.getElementById('copyCount').value) || 1;
        let customName = document.getElementById('customFileName').value.trim();

        if (!customName) {
            customName = originalFileName ? originalFileName.replace('.txt', '') : 'WPS_File';
        }

        // تنظيف المحتوى وتوحيد النهايات إلى CRLF فقط
        let cleanContent = loadedFileContent.replace(/\r?\n/g, "\r\n").trim();

        for (let i = 1; i <= count; i++) {
            let finalFileName = `CRLF_${customName}_${i}.txt`;
            
            // إضافة أسطر فارغة في نهايات الملف للنسخ الإضافية لتمييزها بنظام مُدد بدون تغيير البيانات
            let fileText = cleanContent + "\r\n".repeat(i);

            let blob = new Blob([fileText], { type: 'text/plain;charset=utf-8' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = finalFileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            await new Promise(resolve => setTimeout(resolve, 300));
        }
    }
</script>

</body>
</html>
