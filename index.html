<script>
    let loadedFileContent = "";
    let originalFileName = "";

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            originalFileName = file.name;
            document.getElementById('fileNameDisplay').textContent = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                loadedFileContent = e.target.result;
            };
            reader.readAsText(file);
        }
    }

    // دالة لتحويل نهايات الأسطر إلى CRLF (\r\n) الخاصة بنظام Windows ومُدد
    function convertToCRLF(text) {
        // توحيد الأسطر أولاً ثم استبدالها بـ \r\n
        return text.replace(/\r?\n/g, "\r\n");
    }

    async function processAndDownload() {
        if (!loadedFileContent) {
            alert("يرجى اختيار ملف TXT أولاً!");
            return;
        }

        const count = parseInt(document.getElementById('copyCount').value) || 1;
        let customName = document.getElementById('customFileName').value.trim();

        if (!customName) {
            customName = originalFileName ? originalFileName.replace('.txt', '') : '1170012';
        }

        // تحويل النص إلى تنسيق CRLF
        const crlfContent = convertToCRLF(loadedFileContent);

        for (let i = 1; i <= count; i++) {
            // صياغة اسم الملف ليحتوي على CRLF برقم النسخة لتقبله منصة مدد
            let finalFileName = `CRLF_${customName}_${i}.txt`;
            
            let blob = new Blob([crlfContent], { type: 'text/plain;charset=utf-8' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = finalFileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // تأخير 0.3 ثانية بين كل ملف
            await new Promise(resolve => setTimeout(resolve, 300));
        }
    }
</script>
